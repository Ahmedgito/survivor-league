<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PawPath — a scroll-story pet adoption experience for first-time adopters. All pets and shelters are fictional demo data." />
    <title>PawPath — Find your match</title>
    <!-- Pre-JS splash: the intro loader's first frame (night sky + crescent moon), so "/" is never blank
         while JS downloads. Only on the first visit to "/" per session; React removes it on mount. -->
    <script>
      try { if (location.pathname !== '/' || sessionStorage.getItem('pawpath:intro-seen')) document.documentElement.classList.add('pp-no-splash') } catch (e) {}
    </script>
    <style>
      #pp-splash { position: fixed; inset: 0; z-index: 101; pointer-events: none; background: #1c1830 radial-gradient(120% 70% at 50% 112%, #2a2342 0%, #1c1830 62%); transition: opacity .35s ease; animation: pp-splash-out .5s ease 9s forwards; }
      .pp-no-splash #pp-splash { display: none; }
      #pp-splash svg { position: absolute; right: 9%; top: 12%; width: clamp(64px, 15vmin, 124px); height: auto; }
      @keyframes pp-splash-out { to { opacity: 0; visibility: hidden; } }
    </style>
  </head>
  <body>
    <div id="pp-splash" aria-hidden="true">
      <svg viewBox="0 0 100 100">
        <defs>
          <radialGradient id="pp-splash-glow"><stop offset="0" stop-color="#ffd27a" stop-opacity=".55" /><stop offset="1" stop-color="#ffd27a" stop-opacity="0" /></radialGradient>
          <mask id="pp-splash-mask"><rect width="100" height="100" fill="#fff" /><circle cx="50" cy="50" r="31" fill="#000" transform="translate(-16 0)" /></mask>
        </defs>
        <circle cx="50" cy="50" r="50" fill="url(#pp-splash-glow)" opacity=".25" />
        <circle cx="50" cy="50" r="30" fill="#fff1cf" mask="url(#pp-splash-mask)" />
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
